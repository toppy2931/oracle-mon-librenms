  $('btnRotate').addEventListener('click', (e) => { controls.autoRotate = !controls.autoRotate; controls.autoRotateSpeed = 0.55; e.currentTarget.setAttribute('aria-pressed', String(controls.autoRotate)); });
  $('btnZoomIn').addEventListener('click', () => zoomBy(0.8)); $('btnZoomOut').addEventListener('click', () => zoomBy(1.25));
  new ResizeObserver(resize).observe(stage); window.addEventListener('resize', resize);
  if (demo) loadData(demo, '範例資料'); resize(); requestAnimationFrame(frame);
}
boot();
if (EMBED) {
  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin || e.source !== window.parent) return;      // 只信任同源的父視窗（入口）
    const m = e.data;
    if (!m || m.type !== 'viz-data') return;
    try { const d = validate(m.data); S.start = 0; loadData(d, '即時資料'); $('srcBadge').className = 'badge real'; document.querySelector('h1').textContent = d.assets[0].label + ' · 連線動態'; S.playing = true; setPlay(); setNotice(''); }
    catch (err) { setNotice('資料格式不正確：' + (err && err.message ? err.message : '無法讀取')); }
  });
  window.parent.postMessage({ type: 'viz-ready' }, location.origin);
}
})();
</script>
